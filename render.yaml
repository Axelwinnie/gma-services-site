# Launch static site for https://granitemodels.store.
# LAUNCH is true, so pages are allowed to be indexed.
# Static site for https://granitemodels.store on branch site-launch.
# Leave Root Directory blank.
# The prebuilt public/ directory is the site. Do not run scripts/build.mjs.
# Build command: echo prebuilt. Publish directory: public.
# Render serves public/404.html for unknown paths. Do not add a catch-all rewrite.
services:
  # Existing static site. Branch stays site-launch.
  # autoDeploy is still accepted. autoDeployTrigger is the current name and
  # is what updates an existing service (omitting it leaves the dashboard value).
  # pullRequestPreviewsEnabled is still accepted and matches previews.generation.
  - type: web
    name: gma-services
    runtime: static
    branch: site-launch
    autoDeploy: true
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: true
    previews:
      generation: automatic
    buildCommand: echo prebuilt
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.html
        name: Cache-Control
        value: no-cache

  # Stripe webhook for Workflow Map orders. Separate free web service.
  # Does not replace gma-services or the TikTok service.
  - type: web
    name: gma-stripe-webhook
    runtime: node
    plan: free
    branch: main
    rootDir: stripe-webhook
    buildCommand: echo no-build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        value: granitemodels@gmail.com
